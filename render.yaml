
services:
  - type: web
    name: researchgraph-backend
    runtime: python
    plan: free
    region: singapore

    # Backend is inside the backend/ directory
    rootDir: backend

    # Build and start commands
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Automatically deploy commits pushed to main
    autoDeployTrigger: commit

    # Academic API configuration
    envVars:
      - key: OPENALEX_API_URL
        value: https://api.openalex.org

      - key: OPENALEX_API_KEY
        sync: false

      - key: CROSSREF_API_URL
        value: https://api.crossref.org

      - key: CROSSREF_MAILTO
        sync: false

      - key: UNPAYWALL_API_URL
        value: https://api.unpaywall.org

      - key: UNPAYWALL_EMAIL
        sync: false

      # Local model configuration defaults
      # These do not provide an Ollama server on Render
      - key: OLLAMA_MODEL
        value: llama3.2:3b

      - key: OLLAMA_KEEP_ALIVE
        value: 1h

      - key: OLLAMA_NUM_THREADS
        value: "4"
